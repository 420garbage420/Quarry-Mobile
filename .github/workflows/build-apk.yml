name: Build APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Bundle llama-server native binaries (so servers work with no extra install)
        working-directory: android
        run: |
          set -eux
          TAG="b11580"   # pin for reproducibility; bump when updating llama.cpp
          URL="https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-android-arm64.tar.gz"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sL -o /tmp/llama-android.tar.gz "$URL"
          tar xzf /tmp/llama-android.tar.gz -C /tmp
          SRC=$(find /tmp -maxdepth 2 -type d -name "llama-*" | head -1)
          # The app launches File(nativeLibraryDir, "libllama_server.so") via ProcessBuilder.
          # Android extracts jniLibs/*.so there; naming the PIE server binary with a lib*.so prefix
          # is the standard way to ship an executable inside an APK.
          cp "$SRC/llama-server" app/src/main/jniLibs/arm64-v8a/libllama_server.so
          # Shared libs the server depends on at runtime
          for f in "$SRC"/lib*.so; do
            bn=$(basename "$f")
            # Avoid overwriting the server entrypoint we just placed
            if [ "$bn" != "libllama_server.so" ]; then
              cp "$f" app/src/main/jniLibs/arm64-v8a/
            fi
          done
          chmod 755 app/src/main/jniLibs/arm64-v8a/libllama_server.so
          ls -la app/src/main/jniLibs/arm64-v8a/ | head -30
          # Quick ELF check
          file app/src/main/jniLibs/arm64-v8a/libllama_server.so || true

      - name: Grant execute on gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew --no-daemon assembleDebug -x lint -x test
          find app/build/outputs -name "*.apk" -ls

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quarry-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload native libs listing (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-listing
          path: android/app/src/main/jniLibs/
          retention-days: 7
